# Fixture excerpt of the org's `docs-review.yml` as a one-job wrapper: one job, `publish`, calling
# `review.yml`. Its job id is the middle segment of every check the review reports for a caller that
# calls the wrapper (`docs-review / publish / produce (<part>)`).
on:
  workflow_call:
    inputs:
      l1-results:
        type: string
        default: ''
      repo-routine:
        type: string
        default: ''
      repo-checks:
        type: string
        default: ''
jobs:
  publish:
    uses: exeris-systems/.github/.github/workflows/review.yml@main
    with:
      l1-results: ${{ inputs.l1-results }}
      repo-routine: ${{ inputs.repo-routine }}
      repo-checks: ${{ inputs.repo-checks }}
